# Rate-limit zones for the tutor app. Goes in /etc/nginx/conf.d/.
#
# Defining a zone costs nothing until a `limit_req` references it, so this file is
# safe for the other vhosts on the server. Keyed on the client IP.

# One password guards the whole app and the API quota behind it. Tight.
limit_req_zone $binary_remote_addr zone=tutor_auth:1m rate=5r/m;

# Normal app traffic: a talk turn fires a chat request plus a TTS request, and the
# UI prefetches slow audio, so the burst has to absorb a few at once.
limit_req_zone $binary_remote_addr zone=tutor_api:1m rate=2r/s;

# No limit_req_status here on purpose: it is an http-context directive and another app
# on this box already sets it to 429 globally. Declaring it twice is a hard nginx error.
