# Shared proxy settings for the tutor app.
#
# proxy_pass carries no URI part on purpose: that preserves the full request URI,
# so this snippet works the same in a prefix location and an exact one.
proxy_pass http://127.0.0.1:9003;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# An LLM turn plus TTS can take a while; the default 60s read timeout is enough
# but the send timeout matters for the audio upload on a slow mobile connection.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_request_buffering off;
