# Security headers for the tutor app.
#
# NOTE: add_header does not merge across levels. A location block that declares
# its own add_header drops every inherited one, so this snippet must be included
# again inside any such location.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# Self-hosted everything: no CDN, no external fonts, no analytics. 'unsafe-inline'
# for styles only, for the inline style attributes the UI sets (progress bars, meters).
# media-src blob: is required for MediaRecorder playback of the user's own recording.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
