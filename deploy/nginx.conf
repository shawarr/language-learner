# nginx vhost for the German tutor PWA. Installed by deploy/install-nginx.sh.
#
# Certbot appends the TLS listener/cert lines on first run:
#   certbot --nginx -d german.shawar.xyz
# Until then this file serves plain http on port 80.

server {
    listen 80;
    listen [::]:80;
    server_name german.shawar.xyz;

    # Audio uploads: a 60s recording is well under 1 MB, 25 MB is the provider cap.
    client_max_body_size 26m;

    include snippets/tutor-security-headers.conf;

    # The login endpoint is the brute-force surface: one password guards the whole app.
    location = /api/auth/login {
        limit_req zone=tutor_auth burst=3 nodelay;
        include snippets/tutor-proxy.conf;
    }

    # Transcription and chat turns call out to Gemini/Groq and can take ~30s.
    location /api/ {
        limit_req zone=tutor_api burst=30 nodelay;
        include snippets/tutor-proxy.conf;
    }

    # No `root` block for the manifest: the static files live inside the container, so pointing
    # nginx at a host path 404s. The app serves it with the correct application/manifest+json.

    # The service worker must never be cached, or an old shell sticks forever.
    location = /sw.js {
        include snippets/tutor-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include snippets/tutor-proxy.conf;
    }

    # Everything else (the PWA shell) is served by the app's StaticFiles mount.
    location / {
        include snippets/tutor-proxy.conf;
    }
}
