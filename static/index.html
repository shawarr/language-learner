<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="format-detection" content="telephone=no">
<title>Deutsch Tutor</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>

<div id="login" class="gate" hidden>
  <form id="login-form" class="gate-card" autocomplete="on">
    <div class="brand"><span class="brand-mark" aria-hidden="true">DE</span><h1>Deutsch Tutor</h1></div>
    <label class="label" for="pw">Password</label>
    <input id="pw" class="input" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required>
    <button class="btn primary block" type="submit">Log in</button>
    <p id="login-error" class="error" role="alert" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <main id="screens">
    <section id="screen-talk" class="screen" hidden></section>
    <section id="screen-write" class="screen" hidden></section>
    <section id="screen-drill" class="screen" hidden></section>
    <section id="screen-review" class="screen" hidden></section>
    <section id="screen-progress" class="screen" hidden></section>
    <section id="screen-placement" class="screen" hidden></section>
    <section id="screen-checkpoint" class="screen" hidden></section>
  </main>
  <nav id="tabs" aria-label="Main">
    <button class="tab" data-tab="talk" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.4 3.3A.7.7 0 0 1 4.5 18.7V16A2.5 2.5 0 0 1 4 13.5z"/></svg>
      <span>Talk</span>
    </button>
    <button class="tab" data-tab="write" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.3V20h2.7L17.8 8.9l-2.7-2.7zm13.6-9.9 1.4-1.4a1 1 0 0 0 0-1.4l-1.6-1.6a1 1 0 0 0-1.4 0l-1.4 1.4z"/></svg>
      <span>Write</span>
    </button>
    <button class="tab" data-tab="drill" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5h6L10 22l8.5-11.5h-6z"/></svg>
      <span>Drill</span>
    </button>
    <button class="tab" data-tab="review" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h11a2 2 0 0 1 2 2v11h-2V6H7zM4 8h11a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/></svg>
      <span>Review</span>
    </button>
    <button class="tab" data-tab="progress" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16v-2H4zm1-4h3V9H5zm5.5 0h3V4h-3zm5.5 0h3v-5h-3z"/></svg>
      <span>Progress</span>
    </button>
  </nav>
</div>

<div id="offline" class="banner" hidden>Offline. The app opens, the tutor needs a connection.</div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
</body>
</html>
