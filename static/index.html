<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="format-detection" content="telephone=no">
<title>Deutsch Tutor</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>

<div id="login" class="gate" hidden>
  <div class="gate-card">
    <div class="gate-brand">
      <span id="login-cat" class="gate-cat" aria-hidden="true"></span>
      <h1>Deutsch Tutor</h1>
      <p class="muted">Who is learning tonight?</p>
    </div>
    <div id="login-users" class="login-users" role="group" aria-label="Choose your account"></div>
    <form id="login-form" class="stack" autocomplete="on" hidden>
      <input type="text" name="username" id="login-username" autocomplete="username" hidden>
      <label class="label" id="pw-label" for="pw">Password</label>
      <input id="pw" class="input" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required>
      <button class="btn primary block" type="submit">Log in</button>
      <p id="login-error" class="error" role="alert" hidden></p>
    </form>
    <p class="muted xs center">Two learners, one cat. Your progress is yours; the race is shared.</p>
  </div>
</div>

<div id="app" hidden>
  <main id="screens">
    <section id="screen-home" class="screen" hidden></section>
    <section id="screen-learn" class="screen" hidden></section>
    <section id="screen-talk" class="screen" hidden></section>
    <section id="screen-practice" class="screen" hidden></section>
    <section id="screen-you" class="screen" hidden></section>
    <section id="screen-review" class="screen" hidden></section>
    <section id="screen-drill" class="screen" hidden></section>
    <section id="screen-write" class="screen" hidden></section>
    <section id="screen-placement" class="screen" hidden></section>
    <section id="screen-checkpoint" class="screen" hidden></section>
  </main>
  <nav id="tabs" aria-label="Main">
    <span class="tab-pill" aria-hidden="true"></span>
    <button class="tab" data-tab="home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6h-6v6H4z"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="learn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>
      <span>Learn</span>
    </button>
    <button class="tab" data-tab="talk" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
      <span>Talk</span>
    </button>
    <button class="tab" data-tab="practice" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5h6L10 22l8.5-11.5h-6z"/></svg>
      <span>Practice</span>
    </button>
    <button class="tab" data-tab="you" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>You</span>
    </button>
  </nav>
</div>

<div id="offline" class="banner" hidden>Offline — the tutor needs a connection. Recordings and ratings are kept.</div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="moment-root"></div>
</body>
</html>
